name: Build Standalone Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: sysprofiler-windows
            build_cmd: >
              pyinstaller --noconfirm --onefile --windowed
              --collect-all customtkinter
              --hidden-import=wmi
              --hidden-import=win32com
              --name "SysProfiler" main.py
            output_path: dist/SysProfiler.exe

          - os: ubuntu-22.04
            artifact_name: sysprofiler-linux
            build_cmd: >
              pyinstaller --noconfirm --onefile
              --collect-all customtkinter
              --name "sysprofiler" main.py
            output_path: dist/sysprofiler

          - os: macos-latest
            artifact_name: sysprofiler-macos
            build_cmd: >
              pyinstaller --noconfirm --windowed
              --collect-all customtkinter
              --name "SysProfiler" main.py
            output_path: dist/SysProfiler.app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Tkinter dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: ${{ matrix.build_cmd }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}